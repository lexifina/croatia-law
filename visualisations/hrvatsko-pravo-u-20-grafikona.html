:root {

  --bg: #f7f6f3; --surface: #fcfcfb; --surface-2: #f1f0ec; --line: #e4e2dc; --grid: #ebe9e4;
  --text: #0b0b0b; --text-2: #52514e; --text-3: #7a7974; --accent: #2a78d6;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;

  --seq-lo: #eef4fc; --seq-hi: #0d366b;
  --sea: #e8f0f7; --land: #e9e8e2; --hr-land: #fdfdfc;
  --sans: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --serif: "Source Serif 4", Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {

    --muted-mark: #55544f;
    --seq-lo: #1f2a38; --seq-hi: #9ec5f4;
    --sea: #15202a; --land: #1e1e1c; --hr-land: #34342f;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #131312; --surface: #1a1a19; --surface-2: #222220; --line: #33322f; --grid: #2a2a28;
  --text: #f0efec; --text-2: #c3c2b7; --text-3: #8f8e86; --accent: #3987e5;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
  --muted-mark: #55544f;
  --seq-lo: #1f2a38; --seq-hi: #9ec5f4;
  --sea: #15202a; --land: #1e1e1c; --hr-land: #34342f;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 var(--sans); }
a { color: var(--accent); }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
header.top { padding: 28px 0 8px; }
.bar { display: flex; justify-content: flex-end; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.toggles { display: inline-flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--surface); }
.seg button { border: 0; background: transparent; color: var(--text-2); font: 500 13px/1 var(--sans); padding: 7px 12px; border-radius: 999px; cursor: pointer; min-height: 30px; }
.seg button[aria-pressed="true"] { background: var(--text); color: var(--surface); }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
h1 { font: 600 clamp(28px, 5vw, 44px)/1.2 var(--serif); margin: 0 0 14px; letter-spacing: -.01em; }
.lede { font-size: 17px; color: var(--text-2); max-width: 780px; margin: 0 0 8px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 26px 0 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 14px 12px; }
.tile b { display: block; font: 600 24px/1.15 var(--sans); font-variant-numeric: tabular-nums; }
.tile span { font-size: 12px; color: var(--text-2); line-height: 1.5; display: block; margin-top: 2px; }
details.profile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin: 10px 0 0; }
details.profile > summary, details.tbl > summary { cursor: pointer; padding: 12px 14px; font-weight: 500; font-size: 14px; list-style: none; }
details.profile > summary::-webkit-details-marker, details.tbl > summary::-webkit-details-marker { display: none; }
details.profile > summary::before, details.tbl > summary::before { content: "▸"; display: inline-block; width: 1.1em; color: var(--text-3); transition: transform .15s; }
details[open].profile > summary::before, details[open].tbl > summary::before { transform: rotate(90deg); }
.scroll { overflow-x: auto; padding: 0 14px 14px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; color: var(--text-2); font-size: 12px; }
td.n, th.n { text-align: right; white-space: nowrap; }
code { font: 12px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace; background: var(--surface-2); padding: 1px 5px; border-radius: 5px; word-break: break-all; }
nav.toc { margin: 30px 0 10px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 6px 22px; font-size: 13px; }
nav.toc a { color: var(--text-2); text-decoration: none; display: block; padding: 3px 0; line-height: 1.5; }
nav.toc a:hover { color: var(--text); text-decoration: underline; }
nav.toc .p { font-weight: 600; color: var(--text); margin-top: 6px; }
section.part { padding-top: 34px; }
section.part > h2 { font: 600 26px/1.3 var(--serif); margin: 0 0 6px; }
section.part > p.pd { color: var(--text-2); margin: 0 0 6px; max-width: 780px; }
figure.chart { margin: 22px 0 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 18px 6px; }
figure.chart h3 { font: 600 19px/1.45 var(--serif); margin: 0 0 6px; }
figure.chart h3 .no { color: var(--text-3); font-weight: 500; margin-right: .35em; }
.dek { color: var(--text-2); margin: 0 0 12px; max-width: 840px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--text-2); margin: 0 0 8px; line-height: 1.5; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.legend i.dot { border-radius: 50%; }
.legend i.ring { background: transparent !important; border: 2px solid var(--text-3); border-radius: 50%; }
.legend i.line { height: 2px; width: 14px; border-radius: 1px; vertical-align: 3px; }
.legend i.dash { height: 0; width: 14px; border-radius: 0; border-top: 2px dashed; background: transparent !important; vertical-align: 3px; }
.legend i.hatch { background-image: repeating-linear-gradient(135deg, var(--muted-mark) 0 2px, transparent 2px 5px) !important; background-color: var(--surface-2) !important; }
.legend i.outline { background: transparent !important; border: 2px solid var(--text); border-radius: 3px; }
.plot { width: 100%; position: relative; }
.plot svg { display: block; width: 100%; height: auto; overflow: visible; }
.axis text, .lbl { fill: var(--text-2); font: 11px var(--sans); font-variant-numeric: tabular-nums; }
.lbl.strong { fill: var(--text); font-weight: 500; }
.lbl.mut { fill: var(--text-3); }
.axis path { display: none; }
.axis line, .grid line { stroke: var(--grid); }
.base { stroke: var(--text-3); stroke-width: 1; }
.note { font-size: 12px; color: var(--text-3); margin: 10px 0 4px; line-height: 1.6; }
.note b { color: var(--text-2); font-weight: 500; }
details.tbl { border-top: 1px solid var(--line); margin: 10px -18px 0; }
details.tbl > summary { font-size: 12px; color: var(--text-2); padding: 10px 18px; }
details.tbl .scroll { max-height: 360px; overflow: auto; padding: 0 18px 12px; }
.tip { position: fixed; pointer-events: none; z-index: 10; background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12px; line-height: 1.5; box-shadow: 0 6px 24px rgba(0,0,0,.12); max-width: 340px; opacity: 0; transition: opacity .08s; }
.tip b { font-weight: 600; }
.tip .r { display: flex; justify-content: space-between; gap: 14px; }
.tip .r span:last-child { font-variant-numeric: tabular-nums; }
.tip .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
.tip .q { margin-top: 4px; color: var(--text-2); }
.hit { fill: transparent; cursor: default; }
.mini { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
.mini h4 { margin: 0 0 2px; font: 600 13px/1.4 var(--sans); }
.mini p { margin: 0 0 6px; font-size: 12px; color: var(--text-2); }
.multi { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px 18px; }
.multi h4 { margin: 0; font: 600 13px/1.4 var(--sans); overflow-wrap: anywhere; }
.multi p { margin: 0 0 2px; font-size: 12px; color: var(--text-2); }
.ptiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 4px 0 14px; }
.ptile { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.ptile .pn { font: 500 12px/1.4 var(--sans); color: var(--text-2); overflow-wrap: anywhere; }
.ptile .pv { font-size: 12px; color: var(--text-2); margin: 2px 0; }
.ptile .pv b { font: 600 22px/1.15 var(--sans); color: var(--text); font-variant-numeric: tabular-nums; margin-right: 2px; }
.ptile .ps { font-size: 12px; color: var(--text-3); line-height: 1.5; }
.ptile .pbar { display: flex; gap: 2px; height: 6px; margin-top: 8px; border-radius: 3px; overflow: hidden; }
.ptile .pbar i { display: block; }
.sub { margin: 18px 0 4px; font: 600 13px/1.4 var(--sans); }
footer { color: var(--text-3); font-size: 12px; padding: 40px 0 60px; line-height: 1.6; }
@media (max-width: 560px) {
  figure.chart { padding: 14px 12px 4px; border-radius: 12px; }
  details.tbl { margin: 10px -12px 0; }
  details.tbl > summary { padding: 10px 12px; }
  details.tbl .scroll { padding: 0 12px 12px; }
  .lede { font-size: 15px; }
  .multi { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 10px; }
  .ptiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (forced-colors: active) { .seg button[aria-pressed="true"] { outline: 2px solid CanvasText; } }
</style>

      const gap = j ? 1 : 0, top = j === segs.length - 1;
      const yy0 = y0 - gap, yy1 = top ? y1 : y1 + 1;
      if (yy0 - yy1 < 0.5) return;
      g.append('path').attr('d', top ? colPath(gx, yy0, bw, yy1) : `M${gx},${yy0}V${yy1}H${gx + bw}V${yy0}Z`).attr('fill', colors[s.i]).attr('opacity', opt.partial && opt.partial(r) ? 0.5 : 1);
    });
    if (opt.topLabel) g.append('text').attr('class', 'lbl').attr('x', gx + bw / 2).attr('y', y(Math.min(tot(r), y.domain()[1])) - 5).attr('text-anchor', 'middle').text(opt.topLabel(r));
  });
  g.append('line').attr('class', 'base').attr('x1', 0).attr('x2', iw).attr('y1', ih).attr('y2', ih);
  const every = opt.every || Math.ceil(rows.length / Math.max(4, Math.floor(iw / 44)));
  rows.forEach((r, i) => { if ((opt.labelIf ? opt.labelIf(r) : i % every === 0) || (!opt.labelIf && i === rows.length - 1 && (rows.length - 1) % every >= every / 2)) g.append('text').attr('class', 'lbl').attr('x', x(r.y) + x.bandwidth() / 2).attr('y', ih + 16).attr('text-anchor', 'middle').text(opt.xf ? opt.xf(r.y) : r.y); });
  bindTip(g.selectAll('.hit').data(rows).join('rect').attr('class', 'hit').attr('x', r => x(r.y)).attr('width', x.bandwidth()).attr('y', 0).attr('height', ih),
    opt.tip || (r => `<b>${opt.xf ? opt.xf(r.y) : r.y}${opt.partial && opt.partial(r) ? ' (' + t('partial') + ')' : ''}</b>` + keys.map((k, i) => (r[k] ? trow(colors[i], names[i], fmt(r[k]) + (opt.noShare ? '' : ` · ${pct(r[k], tot(r))}`)) : '')).reverse().join('') + trow(null, t('total'), fmt(tot(r)))));
  return { svg, g, x, y, iw, ih, bw, m };
}
// rows of 100% bands with rounded ends and the shares inside
function bands(el, rows, keys, colors, names, opt) {
  const w = W(el), nw = narrow(w), rowH = opt.rowH || 34;
  const lw = Math.ceil(textW(el, rows.map(r => opt.label(r, nw)))) + 12, rw = Math.ceil(textW(el, rows.map(r => opt.right(r, nw)))) + 12;
  const m = { t: 4, r: rw, b: 22, l: lw };
  const h = m.t + m.b + rowH * rows.length, svg = svgIn(el, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
  const iw = w - m.l - m.r, x = d3.scaleLinear().domain([0, 1]).range([0, iw]);
  [0, .25, .5, .75, 1].forEach(v => g.append('text').attr('class', 'lbl mut').attr('x', x(v)).attr('y', rowH * rows.length + 14).attr('text-anchor', v === 0 ? 'start' : v === 1 ? 'end' : 'middle').text(pv(100 * v)));
  const id0 = 'bd' + (++HATCH);
  rows.forEach((r, i) => {
    const y0 = i * rowH + 6, bh = rowH - 12, tot = sum(keys, k => r[k] || 0), id = id0 + '_' + i;
    g.append('text').attr('class', 'lbl strong').attr('x', -10).attr('y', y0 + bh / 2 + 4).attr('text-anchor', 'end').text(opt.label(r, nw));
    if (!tot) return;
    g.append('clipPath').attr('id', id).append('rect').attr('x', 0).attr('y', y0).attr('width', iw).attr('height', bh).attr('rx', bh / 2);
    const row = g.append('g').attr('clip-path', `url(#${id})`).attr('opacity', opt.partial && opt.partial(r) ? .55 : 1);
    let acc = 0;
    keys.forEach((k, j) => {
      const v = r[k] || 0; if (!v) return;
      const x0 = x(acc / tot), x1 = x((acc + v) / tot); acc += v;
      row.append('rect').attr('x', x0).attr('width', Math.max(0, x1 - x0 - (acc < tot ? 1.5 : 0))).attr('y', y0).attr('height', bh).attr('fill', colors[j]);
      const lab = pct(v, tot);
      if (x1 - x0 > textW(el, [lab], 'lbl') + 8) row.append('text').attr('class', 'lbl').attr('x', (x0 + x1) / 2).attr('y', y0 + bh / 2 + 4).attr('text-anchor', 'middle')
        .style('fill', inkOn(colors[j])).style('pointer-events', 'none').text(lab);
    });
    g.append('text').attr('class', 'lbl strong').attr('x', iw + 10).attr('y', y0 + bh / 2 + 4).text(opt.right(r, nw));
    bindTip(g.append('rect').attr('class', 'hit').attr('x', -m.l).attr('width', w).attr('y', i * rowH).attr('height', rowH).datum(r),
      d => `<b>${esc(opt.label(d, false))}</b>` + keys.map((k, j) => d[k] ? trow(colors[j], names[j], `${fmt(d[k])} · ${pct(d[k], tot)}`) : '').join('') + trow(null, t('total'), fmt(tot)));
  });
  return { svg, g, iw };
}
// a list of horizontal bars, label on the left (on narrow screens above the bar, in two lines if needed), value on the right
function barList(el, rows, o) {
  const w = W(el), nw = narrow(w) && !o.side, labs = rows.map(r => o.label(r, nw)), rw = o.rw || 44;
  const lw = nw ? 0 : Math.min(o.cap || 480, textW(el, labs) + 14);
  const lines = labs.map(s => nw ? wrap2(el, s, w - 4) : [s]), sub = rows.map(r => o.sub ? o.sub(r) : '');
  const rowHs = lines.map((ls, i) => (nw ? 20 + 13 * ls.length : 22) + (sub[i] ? 13 : 0)), tops = rowHs.reduce((a, h) => a.concat(a[a.length - 1] + h), [0]);
  const svg = svgIn(el, w, 4 + tops[tops.length - 1]), g = svg.append('g').attr('transform', `translate(${lw},2)`);
  const x = d3.scaleLinear().domain([0, o.max || d3.max(rows, o.value) || 1]).range([0, Math.max(40, w - lw - rw)]);
  rows.forEach((r, i) => {
    const cy = tops[i], by = nw ? cy + 13 * lines[i].length + 3 : cy + 5;
    if (nw) lines[i].forEach((ln, k) => g.append('text').attr('class', 'lbl strong').attr('x', 0).attr('y', cy + 11 + 13 * k).text(ln));
    else g.append('text').attr('class', 'lbl strong').attr('x', -8).attr('y', cy + 15).attr('text-anchor', 'end').text(labs[i]);
    let acc = 0; const segs = (o.segs ? o.segs(r) : [[o.value(r), o.color ? o.color(r) : css('--s1')]]).filter(s => s[0] > 0);
    segs.forEach(([v, c], j) => { const last = j === segs.length - 1, x0 = x(acc), x1 = x(acc + v); acc += v;
      g.append('path').attr('d', last ? barPath(x0, by, Math.max(x0 + 2, x1), 12, 3) : `M${x0},${by}h${Math.max(0, x1 - x0 - 1)}v12h${-Math.max(0, x1 - x0 - 1)}Z`).attr('fill', c); });
    g.append('text').attr('class', 'lbl').attr('x', Math.max(2, x(acc)) + 6).attr('y', by + 10).text(o.right ? o.right(r) : fmt(acc));
    if (sub[i]) g.append('text').attr('class', 'lbl mut').attr('x', nw ? 0 : 0).attr('y', by + 12 + 12).text(sub[i]);
    if (o.tip) bindTip(g.append('rect').attr('class', 'hit').attr('x', -lw).attr('width', w).attr('y', cy).attr('height', rowHs[i]).datum(r), o.tip);
  });
  return { svg, g, x };
}

chart('c07', el => {
  const c = D.c07, rows = c.periods.map(([p, o]) => ({ p, ...o }));
  const T = {}; C07.forEach(k => T[k] = sum(rows, r => r[k] || 0)); const N = sum(C07, k => T[k]);
  const d0late = sum(rows.filter(r => +r.p >= 2015), r => r.d0 || 0), d0early = rows.find(r => r.p === '1990');
  return {
    title: L(`Osmi dan nakon objave: tada na snagu stupa ${pct(T.d8, N)} zakona, a „danom objave” od 2015. samo ${HR() ? nhr(d0late, 'zakon', 'zakona', 'zakona') : nen(d0late, 'law', 'laws')}`,
      `The eighth day after publication: ${pct(T.d8, N)} of laws take effect then, and only ${nen(d0late, 'law', 'laws')} on the day of publication since 2015`),
    toc: L('Kada zakoni stupaju na snagu', 'When laws take effect'),
    dek: L(`„Zakon stupa na snagu najranije osmi dan od dana njegove objave, osim ako nije zbog osobito opravdanih razloga zakonom drukčije određeno” (čl. 90. Ustava, isti tekst od 1990.). Svaki pruh pokazuje koliko je zakona jednog petogodišta stupilo na snagu kojeg dana. Na dan objave na snagu je stupilo ${pct(d0early.d0, sum(C07, k => d0early[k] || 0))} zakona iz 1990.–1994.; od 2015. zakoni koji ne čekaju osmi dan stupaju na snagu idući dan.`,
      `“A law enters into force no earlier than the eighth day after its publication, unless otherwise provided by law for particularly justified reasons” (Article 90 of the Constitution, the same text since 1990). Each band shows on which day the laws of a five-year period took effect. ${pct(d0early.d0, sum(C07, k => d0early[k] || 0))} of the laws of 1990–1994 took effect on the day of publication; since 2015 laws that do not wait for the eighth day take effect on the next day instead.`),
    draw(el) {
      const cols = S8(), colors = [cols[7], cols[1], cols[4], cols[0], cols[2], cols[5], css('--muted-mark')];
      legend(el, C07.map((k, i) => ({ c: colors[i], l: LA(C07N[k]) })));
      bands(el, rows, C07, colors, C07.map(k => LA(C07N[k])), { label: (r, nw) => nw ? `’${r.p.slice(2)}` : perLong(r.p), right: r => fmt(sum(C07, k => r[k] || 0)), partial: r => r.p === '2025', rowH: 34 });
      note(el, ['git log (Published, In-force)', 'data/zakoni.json (published, in_force)'], N_(N, 'zakon'),
        L(`dan stupanja na snagu je onaj koji navodi odredba samog zakona (zakon čiji se dan ne može pročitati repozitorij zadržava, pa ovdje nije). Brojeno od dana objave u Narodnim novinama; „kasnije” znači nakon osmog dana. Desno je broj zakona; 2025.–2026. je nepotpuno.`,
          `the in-force day is the one the law’s own clause gives (a law whose day cannot be read is held back by the repository, so it is not here). Counted from the day of publication in Narodne novine; “later” means after the eighth day. The number of laws is on the right; 2025–2026 is partial.`));
      table(el, [L('Razdoblje', 'Period'), ...C07.map(k => LA(C07N[k])), t('total')], c.years.map(([y, o]) => [String(y), ...C07.map(k => o[k] || 0), sum(C07, k => o[k] || 0)]));
    }
  };
});

chart('c08', el => {
  const c = D.c08, keys = ['zakon', 'uredba', 'pravilnik', 'odluka', 'ostalo'], top = c[0];
  const eu = D.c08_basis.eu['2013-07-01'] || 0, euro = D.c08_basis.euro['2023-01-01'] || 0;
  const what = d => { const s = (d.stems[0] || [''])[0];
    if (d.d === '2013-07-01') return L(`pristupanje EU: ${N_(eu, 'akt')} ${pl(eu, 'navodi', 'navode', 'navodi')} ga kao temelj stupanja na snagu`, `EU accession: ${fmt(eu)} acts give it as the basis of their day`);
    if (d.d === '2023-01-01') return L(`euro: ${N_(euro, 'akt')} ${pl(euro, 'navodi', 'navode', 'navodi')} uvođenje eura kao temelj stupanja na snagu`, `the euro: ${fmt(euro)} acts give its introduction as the basis of their day`);
    if (/^Odluka o visini poreznih stopa/.test(s)) return L(`${N_(d.stems[0][1], 'odluka')} općina i gradova o stopama poreza na dohodak`, `${fmt(d.stems[0][1])} municipal and city decisions on income tax rates`);
    if (/^Odluka o usklađivanju mirovina/.test(s)) return L('usklađivanje mirovina i drugih primanja', 'pensions and other benefits adjusted');
    return ''; };
  const nT = tot5(top), usual = c.slice(0, 3).map(d => d.d).join() === '2024-01-01,2023-01-01,2013-07-01';
  return {
    title: L(`${Cap(dateTxt(top.d))}: ${N_(nT, 'akt')} ${pl(nT, 'stupio je', 'stupila su', 'stupilo je')} na snagu istoga dana`, `${dateTxt(top.d)}: ${fmt(nT)} acts took effect on a single day`),
    toc: L('Dani s najviše novih propisa', 'The busiest days'),
    dek: L(`Petnaest dana na koje je stupilo na snagu najviše akata Narodnih novina u repozitoriju, po vrsti akta.` + (usual ? ` Prva su dva 1. siječnja: ${yT(2024)}, kad su na snagu stupile odluke općina i gradova o porezu na dohodak, i ${yT(2023)}, s uvođenjem eura; treći je 1. srpnja 2013., dan pristupanja Europskoj uniji.` : ''),
      `The fifteen days on which the most acts of Narodne novine in the repository took effect, by kind of act.` + (usual ? ` The first two are 1 January: in 2024, when the municipal and city decisions on income tax took effect, and in 2023, with the euro; third is 1 July 2013, the day Croatia joined the European Union.` : '')),
    draw(el) {
      const col = KCOL(), colors = keys.map(k => col[k]);
      legend(el, keys.map((k, i) => ({ c: colors[i], l: LA(KIND[k]) })));
      barList(el, c, { label: d => dateTxt(d.d), sub: d => what(d), segs: d => keys.map((k, i) => [d[k] || 0, colors[i]]), value: tot5, cap: 220, rw: 36,
        tip: d => `<b>${dateTxt(d.d)}</b>` + keys.map((k, i) => d[k] ? trow(colors[i], LA(KIND[k]), fmt(d[k])) : '').join('') + trow(null, t('total'), fmt(tot5(d))) + (HR() ? '<div class="q">' + d.stems.map(s => `${esc(s[0])}… (${s[1]})`).join('<br>') + '</div>' : '') });
      note(el, ['git log (In-force, In-force-basis)', 'data/zakoni.json'], N_(sum(c, tot5), 'akt') + L(' u 15 dana', ' on 15 days'),
        L('broji se dan kad je akt prvi put stupio na snagu, kako ga navodi njegova odredba; zadržani akti nemaju dan pa nisu uključeni. Za 1. srpnja 2013. i 1. siječnja 2023. broj akata koji kao temelj navode pristupanje EU ili uvođenje eura uzet je iz trailera In-force-basis.',
          'the day counted is the day an act first took effect, as its own clause gives it; acts held back have no day and are not included. For 1 July 2013 and 1 January 2023 the number of acts that give EU accession or the euro as their basis comes from the In-force-basis trailer.'));
      table(el, [L('Dan', 'Day'), ...keys.map(k => LA(KIND[k])), t('total')], c.map(d => [d.d, ...keys.map(k => d[k] || 0), tot5(d)]));
    }
  };
});

chart('c09', el => {
  const c = D.c09.slice(0, 20), Y0 = 1990, Y1 = 2026, YRS = d3.range(Y0, Y1 + 1), top = c[0];
  const first = r => +Object.keys(r.by).sort()[0];
  const ex = c.filter(r => r.new.length >= 3).sort((a, b) => b.new.length - a.new.length || b.n - a.n)[0];
  return {
    title: L(`Najčešće mijenjani zakoni: ${top.name} ${fmt(top.n)} ${pl(top.n, 'put', 'puta', 'puta')} od ${yT(first(top))}`, `The most amended laws: the ${lawName(top.name)} ${fmt(top.n)} times since ${first(top)}`),
    toc: L('Najčešće mijenjani zakoni', 'The most amended laws'),
    dek: L(`Svaki redak je jedan zakon, svako polje jedna godina: što tamnije, to je više zakona o izmjenama i dopunama toga zakona objavljeno te godine. Uokvirena polja su godine u kojima je Sabor donio novi zakon istog naslova, koji je zamijenio stari${ex ? ` (${ex.name}: ${andHr(ex.new.map(n => yT(n[0])))})` : ''}.`,
      `Each row is one law and each cell one year: the darker, the more laws amending it were published that year. Outlined cells are years in which the Sabor passed a new law of the same title that replaced the old one${ex ? ` (the ${lawName(ex.name)}: ${andEn(ex.new.map(n => n[0]))})` : ''}.`),
    draw(el) {
      const short = s => s.replace(/ u Republici Hrvatskoj$/, '');      // the row label; the tooltip keeps the full name
      const w = W(el), nw = narrow(w), rowH = 21, labs = c.map(r => short(lawName(r.name)));
      const lw = nw ? 0 : Math.ceil(Math.min(textW(el, labs), w * 0.42)) + 12, rw = nw ? 28 : 64, up = nw ? 13 : 0;
      const m = { t: 20, l: lw }, iw = w - lw - rw, cw = iw / YRS.length, h = m.t + (rowH + up) * c.length + 4;
      const mx = d3.max(c, r => d3.max(Object.values(r.by))), ramp = seqRamp(), col = n => ramp(0.15 + 0.85 * Math.sqrt(n / mx));
      legend(el, [1, 2, 3, mx].map(n => ({ c: col(n), l: n === mx ? L(`${N_(n, 'izmjena')} u godini`, `${n} amending laws a year`) : String(n) })).concat([{ c: css('--surface-2'), l: L('godina bez izmjene', 'a year without one') }, { c: css('--text'), l: L('novi zakon istog naslova', 'a new law of the same title'), shape: 'outline' }]));
      const svg = svgIn(el, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
      YRS.forEach((y, j) => { if (y % (nw ? 10 : 5) === 0) g.append('text').attr('class', 'lbl').attr('x', j * cw + cw / 2).attr('y', -7).attr('text-anchor', 'middle').text(y); });
      const xb = d3.scaleLinear().domain([0, top.n]).range([0, rw - (nw ? 4 : 30)]);
      c.forEach((r, i) => {
        const cy = i * (rowH + up) + up, newY = new Set(r.new.map(n => n[0])), born = Math.min(first(r), ...(r.new.length ? r.new.map(n => n[0]) : [9999]));
        if (nw) g.append('text').attr('class', 'lbl strong').attr('x', 0).attr('y', cy - 3).text(labs[i]);
        else g.append('text').attr('class', 'lbl strong').attr('x', -8).attr('y', cy + 15).attr('text-anchor', 'end').text(labs[i]);
        YRS.forEach((y, j) => {
          if (y < born) return;
          const n = r.by[String(y)] || 0;
          g.append('rect').attr('x', j * cw + 0.75).attr('y', cy + 2).attr('width', Math.max(1, cw - 1.5)).attr('height', rowH - 4).attr('rx', Math.min(3, cw / 3)).attr('fill', n ? col(n) : css('--surface-2'));
          if (newY.has(y)) g.append('rect').attr('x', j * cw + 0.75).attr('y', cy + 2).attr('width', Math.max(1, cw - 1.5)).attr('height', rowH - 4).attr('rx', Math.min(3, cw / 3)).attr('fill', 'none').attr('stroke', css('--text')).attr('stroke-width', 1.6);
        });
        if (!nw) g.append('path').attr('d', barPath(iw + 8, cy + 6, iw + 8 + xb(r.n), rowH - 12, 2)).attr('fill', css('--s1'));
        g.append('text').attr('class', 'lbl').attr('x', iw + (nw ? 4 : 12) + (nw ? 0 : xb(r.n))).attr('y', cy + 15).text(r.n);
        bindTip(g.append('rect').attr('class', 'hit').attr('x', -lw).attr('width', w).attr('y', cy - up).attr('height', rowH + up).datum(r),
          d => `<b>${esc(lawName(d.name))}</b>` + trow(null, L('Zakona o izmjenama', 'Amending laws'), fmt(d.n)) + (d.new.length ? trow(null, L('Novi zakon istog naslova', 'New law of the same title'), d.new.map(n => n[0]).join(', ')) : '') +
            trow(null, L('Najviše u godini', 'Most in a year'), (() => { const e = Object.entries(d.by).reduce((a, b) => b[1] > a[1] ? b : a); return `${e[1]} (${e[0]})`; })()));
      });
      note(el, [['git log (naslov zakona)', 'git log (law title)'], 'data/zakoni.json', 'data/held.json'], N_(sum(c, r => r.n), 'izmj'),
        L('zakon o izmjenama pridružen je zakonu čiji naslov navodi (u genitivu: „… Zakona o porezu na dohodak”), pa redak spaja sve zakone istog naslova; novi zakon istog naslova obično stari zamjenjuje. Zakon koji mijenja više zakona broji se uz prvi. Godina je godina objave.',
          'an amending law is matched to the law its title names (“… Zakona o porezu na dohodak”), so a row joins every law of that title; a new law of the same title usually replaces the old one. A law amending several laws counts for the first. The year is the year of publication.'));
      table(el, [L('Zakon', 'Act'), ...YRS.map(String), t('total')], c.map(r => [lawName(r.name), ...YRS.map(y => r.by[String(y)] || 0), r.n]));
    }
  };
});

chart('c10', el => {
  const c = D.c10, decs = ['1990', '2000', '2010', '2020'];
  const DN = { 1990: ['1990-ih', '1990s'], 2000: ['2000-ih', '2000s'], 2010: ['2010-ih', '2010s'], 2020: ['od 2020.', 'since 2020'] };
  const m0 = c['2000'].median, m1 = c['2010'].median;
  return {
    title: L(`Do prve izmjene: polovica novih zakona iz 2000-ih i 2010-ih izmijenjena je unutar ${dec(Math.max(m0, m1), 1)} godine`, `Until the first amendment: half of the new laws of the 2000s and 2010s were amended within ${dec(Math.max(m0, m1), 1)} years`),
    toc: L('Koliko brzo dolazi prva izmjena', 'How soon the first amendment comes'),
    dek: L(`Za nove zakone svakog desetljeća: koliki ih je udio još bez ikakve izmjene nakon toliko godina od objave (Kaplan-Meierova procjena; zakon ukinut ili zamijenjen prije izmjene ispada iz računa). Polovica zakona iz 2000-ih izmijenjena je unutar ${dec(m0, 1)} godine, iz 2010-ih unutar ${dec(m1, 1)}; nakon pet godina bez izmjene bilo je ${pct(c['1990'].s5, 1)} zakona iz 1990-ih.`,
      `For the new laws of each decade: what share was still without any amendment so many years after publication (Kaplan-Meier estimate; a law repealed or replaced before an amendment drops out). Half of the laws of the 2000s were amended within ${dec(m0, 1)} years, of the 2010s within ${dec(m1, 1)}; after five years ${pct(c['1990'].s5, 1)} of the laws of the 1990s were still unamended.`),
    draw(el) {
      const cols = S8(), colors = { 1990: cols[6], 2000: cols[1], 2010: cols[0], 2020: cols[2] };
      legend(el, decs.map(d => ({ c: colors[d], l: `${L('Zakoni ', 'Laws of the ')}${LA(DN[d])} (${fmt(c[d].n)})`, shape: 'line' })));
      const w = W(el), nw = narrow(w), h = 300, m = { t: 14, r: nw ? 46 : 96, b: 34, l: 44 };
      const svg = svgIn(el, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
      const iw = w - m.l - m.r, ih = h - m.t - m.b, H = 12;
      const x = d3.scaleLinear().domain([0, H]).range([0, iw]), y = d3.scaleLinear().domain([0, 1]).range([ih, 0]);
      yAxis(g, y, iw, 5, v => pv(100 * v));
      d3.range(0, H + 1, 2).forEach(v => g.append('text').attr('class', 'lbl').attr('x', x(v)).attr('y', ih + 16).attr('text-anchor', 'middle').text(v));
      g.append('text').attr('class', 'lbl mut').attr('x', iw).attr('y', ih + 30).attr('text-anchor', 'end').text(L('godina od objave', 'years since publication'));
      g.append('line').attr('class', 'base').attr('x1', 0).attr('x2', iw).attr('y1', ih).attr('y2', ih);
      g.append('line').attr('x1', 0).attr('x2', iw).attr('y1', y(.5)).attr('y2', y(.5)).attr('stroke', css('--text-3')).attr('stroke-dasharray', '3 3');
      const ends = [];
      decs.forEach(d => {
        const cv = c[d].curve, tmax = Math.min(H, c[d].maxt), pts = [];
        cv.forEach((p, i) => { if (p[0] > tmax) return; if (i) pts.push([p[0], cv[i - 1][1]]); pts.push([p[0], p[1]]); });
        pts.push([tmax, cv.filter(p => p[0] <= tmax).slice(-1)[0][1]]);
        g.append('path').attr('d', d3.line().x(p => x(p[0])).y(p => y(p[1]))(pts)).attr('fill', 'none').attr('stroke', colors[d]).attr('stroke-width', 2.2);
        if (c[d].median && c[d].median <= H) {
          g.append('line').attr('x1', x(c[d].median)).attr('x2', x(c[d].median)).attr('y1', y(.5)).attr('y2', ih).attr('stroke', colors[d]).attr('stroke-dasharray', '2 3');
        }
        ends.push({ d, x: x(tmax), y: y(pts[pts.length - 1][1]), v: pts[pts.length - 1][1], t: tmax });
      });
      // end labels, kept apart vertically
      ends.sort((a, b) => a.y - b.y); for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 13) ends[i].y = ends[i - 1].y + 13;
      ends.forEach(e => halo(g, e.x + 6, e.y + 4, nw ? pv(100 * e.v) : `${LA(DN[e.d])} ${pv(100 * e.v)}`, 'start', 'lbl strong', colors[e.d]));
      halo(g, iw - 4, y(.5) + 14, L('polovica još bez izmjene', 'half still unamended'), 'end', 'lbl mut');
      bindTip(g.append('rect').attr('class', 'hit').attr('width', iw).attr('height', ih).datum(1), () => `<b>${L('Bez izmjene nakon', 'Unamended after')}</b>` +
        [1, 2, 5].map(k => trow(null, L(`${k} ${pl(k, 'godine', 'godine', 'godina')}`, `${k} year${k > 1 ? 's' : ''}`), decs.map(d => pv(100 * c[d]['s' + k])).join(' · '))).join('') + `<div class="q">${decs.map(d => LA(DN[d])).join(' · ')}</div>`);
      note(el, ['registry/data/acts.json (amended_by)', 'data/zakoni.json (amended_by)'], N_(sum(decs, d => c[d].n), 'novi'),
        L(`izmjena je prvi kasniji akt koji Narodne novine povezuju sa zakonom kao izmjenu (bez ispravaka i odluka Ustavnog suda), prema popisu u registry/data/acts.json; akti dodani poslije tog popisa (${N_(PF.acts_unlinked, 'akt')} svih vrsta) nemaju veze pa nisu uključeni. Isprekidane okomite crte su medijani. Zakoni od 2020. prate se kraće.`,
          `an amendment is the first later act Narodne novine links to the law as amending it (corrections and Constitutional Court decisions left out), per the list in registry/data/acts.json; acts added after that list was written (${fmt(PF.acts_unlinked)} of all kinds) have no links and are left out. The dashed vertical lines are the medians. Laws since 2020 are followed for less time.`));
      table(el, [L('Desetljeće', 'Decade'), L('Zakona', 'Laws'), L('Izmijenjeno', 'Amended'), L('Bez izmjene nakon 1 god.', 'Unamended after 1 yr'), L('nakon 2 god.', 'after 2 yrs'), L('nakon 5 god.', 'after 5 yrs'), L('Medijan (god.)', 'Median (yrs)')],
        decs.map(d => [LA(DN[d]), c[d].n, c[d].events, pv(100 * c[d].s1), pv(100 * c[d].s2), pv(100 * c[d].s5), c[d].median ? dec(c[d].median, 1) : '–']));
    }
  };
});

const C11 = ['inforce', 'amended', 'cited', 'replaced', 'repealed', 'other'];
const C11N = { inforce: ['na snazi, bez izmjena', 'in force, never amended'], amended: ['izmijenjen', 'amended'], cited: ['kasniji akt ga navodi s kasnijim brojem NN', 'cited by a later act with a later NN number'],
  replaced: ['zamijenjen novim zakonom', 'replaced by a new law'], repealed: ['ukinut', 'repealed'], other: ['ostalo', 'other'] };
chart('c11', el => {
  const rows = D.c11.map(([p, o]) => ({ p, ...o })), tot = r => sum(C11, k => r[k] || 0);
  const r00 = rows.find(r => r.p === '2005'), r90 = rows.find(r => r.p === '1990');
  return {
    title: L(`Što je ostalo netaknuto: od zakona iz 2005.–2009. bez ikakve izmjene na snazi je ${pct(r00.inforce, tot(r00))}`, `What is left untouched: of the laws of 2005–2009, ${pct(r00.inforce, tot(r00))} are in force and never amended`),
    toc: L('Što je od zakona ostalo', 'What is left of the laws'),
    dek: L(`Novi zakoni (bez zakona o izmjenama) svakog petogodišta prema stanju koje im repozitorij daje: na snazi bez ikakve izmjene, izmijenjeni, zamijenjeni novim zakonom ili ukinuti. Od zakona iz 2005.–2009. ukinuto je ${pct(r00.repealed, tot(r00))}, a netaknuto ostalo ${pct(r00.inforce, tot(r00))}; od zakona iz 1990.–1994. netaknuto je ${pct(r90.inforce, tot(r90))}.`,
      `The new laws (amending laws left out) of each five-year period by the status the repository gives them: in force and never amended, amended, replaced by a new law or repealed. Of the laws of 2005–2009, ${pct(r00.repealed, tot(r00))} have been repealed and ${pct(r00.inforce, tot(r00))} are untouched; of the laws of 1990–1994, ${pct(r90.inforce, tot(r90))} are untouched.`),
    draw(el) {
      const cols = S8(), colors = [cols[2], cols[0], cols[6], cols[3], cols[7], css('--muted-mark')];
      legend(el, C11.map((k, i) => ({ c: colors[i], l: LA(C11N[k]) })));
      bands(el, rows, C11, colors, C11.map(k => LA(C11N[k])), { label: (r, nw) => nw ? `’${r.p.slice(2)}` : perLong(r.p), right: r => fmt(tot(r)), partial: r => r.p === '2025', rowH: 34 });
      note(el, ['registry/data/acts.json (status)', 'data/zakoni.json (status)'], N_(sum(rows, tot), 'novi'),
        L('stanje je ono koje repozitorij upisuje iz veza Narodnih novina („amended, not consolidated”, „repealed, not consolidated” i slično); „na snazi” znači da nijedan kasniji akt ne mijenja, ne ukida i ne zamjenjuje zakon. Zakon koji je zastario bez formalnog ukidanja ostaje „na snazi”. Zakoni dodani poslije popisa u registry/ nisu uključeni; 2025.–2026. je nepotpuno.',
          'the status is the one the repository records from Narodne novine’s links (“amended, not consolidated”, “repealed, not consolidated” and the like); “in force” means no later act amends, repeals or replaces the law. A law that became obsolete without a formal repeal stays “in force”. Laws added after the list in registry/ are left out; 2025–2026 is partial.'));

chart('c14', el => {

chart('c15', el => {

  const lo = years.reduce((a, b) => turn(a) < turn(b) ? a : b);
  return {
    title: L(`Izlaznost na izborima za Sabor: od ${pv(100 * turn('2003'), 1)} (2003.) do ${pv(100 * turn(lo), 1)} (${yT(lo)}), a ${yT(2024)} ${pv(100 * turn('2024'), 1)}`,
      `Turnout in elections to the Sabor: from ${pv(100 * turn('2003'), 1)} (2003) down to ${pv(100 * turn(lo), 1)} (${lo}), and ${pv(100 * turn('2024'), 1)} in 2024`),
    toc: L('Izlaznost na izborima za Sabor', 'Turnout in elections to the Sabor'),
    dek: L(`Za svaku od deset izbornih jedinica na području Hrvatske i svake izbore od 2003.: udio birača koji su glasovali, prema glasačkim listićima, kako ga objavljuje Državno izborno povjerenstvo. Najniža je bila ${yT(lo)} (${pv(100 * turn(lo), 1)}); ${yT(2024)} izlaznost je ponovno porasla na ${pv(100 * turn('2024'), 1)}.`,
      `For each of the ten electoral districts in Croatia and each election since 2003: the share of voters who voted, by the ballots, as the State Electoral Commission publishes it. The lowest was in ${lo} (${pv(100 * turn(lo), 1)}); in 2024 turnout rose again to ${pv(100 * turn('2024'), 1)}.`),
    draw(el) {
      const w = W(el), nw = narrow(w), lab = u => L(`${ROMAN[u]}. jedinica`, `District ${ROMAN[u]}`), lw = Math.ceil(textW(el, units.map(lab).concat([L('Ukupno I.–X.', 'Total I–X')]))) + 12;
      const ch = nw ? 24 : 26, m = { t: 24, l: lw }, cw = (w - lw - 6) / years.length, h = m.t + ch * (units.length + 1) + 8;
      const vals = years.flatMap(y => units.map(u => c[y][u] ? c[y][u][1] / c[y][u][0] : null)).filter(v => v != null);
      const ramp = seqRamp(), col = v => ramp(0.08 + 0.92 * (v - 0.4) / (d3.max(vals) - 0.4));
      const svg = svgIn(el, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
      years.forEach((y, j) => g.append('text').attr('class', 'lbl strong').attr('x', j * cw + cw / 2).attr('y', -9).attr('text-anchor', 'middle').text(y));
      const rowsAll = units.map(u => ({ u })).concat([{ u: 'all' }]);
      rowsAll.forEach((r, i) => {
        const cy = i * ch + (r.u === 'all' ? 6 : 0);
        g.append('text').attr('class', 'lbl strong').attr('x', -8).attr('y', cy + ch / 2 + 4).attr('text-anchor', 'end').text(r.u === 'all' ? L('Ukupno I.–X.', 'Total I–X') : lab(r.u));
        years.forEach((y, j) => {
          const v = r.u === 'all' ? turn(y) : (c[y][r.u] ? c[y][r.u][1] / c[y][r.u][0] : null);

// a label that runs past the edge of its chart's card would be cut: report it (the charts size their columns to their labels)
function checkLeftLabels(fig) {
  const fr = fig.node().getBoundingClientRect();
  fig.selectAll('svg text').each(function () {
    const r = this.getBoundingClientRect();
    if (r.width && (r.left < fr.left - 0.5 || r.right > fr.right + 0.5)) console.warn('label outside its chart', fig.attr('id'), this.textContent);
  });
}

  HATCH = 0;
  document.documentElement.lang = LANG;
  document.title = t('title');
  d3.selectAll('[data-i]').each(function () { this.textContent = t(this.dataset.i); });
  document.getElementById('gl-link').innerHTML = t('gl');
  d3.selectAll('[data-lang]').attr('aria-pressed', function () { return String(this.dataset.lang === LANG); });
  d3.selectAll('[data-theme-set]').attr('aria-pressed', function () { return String(this.dataset.themeSet === THEME); });
  const tv = [[fmt(PF.commits), L('commitova u povijesti', 'commits in the history')], [fmt(PF.acts), L('akata službenog dijela Narodnih novina', 'acts of the official part of Narodne novine')],
    [fmt(PF.laws), L('zakona od 1990.', 'laws since 1990')], [fmt(PF.treaties), L('akata o međunarodnim ugovorima', 'treaty acts')], [fmt(PF.corrections), L('ispravaka', 'corrections')], [fmt(PF.ustav_versions), L('verzija Ustava', 'versions of the Constitution')]];
  d3.select('#tiles').html('').selectAll('div').data(tv).join('div').attr('class', 'tile').html(d => `<b>${d[0]}</b><span>${d[1]}</span>`);
  profileTable();
  const main = d3.select('#main').html(''), toc = d3.select('#toc').html('');
  let sec = null, n = 0;
  CH.forEach(c => {
    if (c.part) {
      sec = main.append('section').attr('class', 'part').attr('id', c.id);
      sec.append('h2').text(L(c.hr, c.en)); sec.append('p').attr('class', 'pd').text(L(c.dhr, c.den));
      toc.append('a').attr('class', 'p').attr('href', '#' + c.id).text(L(c.hr, c.en));
      return;
    }
    n++;
    const fig = sec.append('figure').attr('class', 'chart').attr('id', c.id);
    let spec;
    try { spec = c.fn(fig); } catch (e) { fig.append('p').attr('class', 'note').text('Error: ' + e.message); console.error(c.id, e); return; }
    const dots = s => s.replace(/(\d)\.\.(?=\s|$)/g, '$1.');     // a Croatian ordinal year ending a sentence takes one dot
    const h3 = fig.append('h3'); h3.append('span').attr('class', 'no').text(n + '.'); h3.append('span').text(dots(spec.title));
    fig.append('p').attr('class', 'dek').text(dots(spec.dek));
    try { spec.draw(fig); } catch (e) { fig.append('p').attr('class', 'note').text('Error: ' + e.message); console.error(c.id, e); }
    checkLeftLabels(fig);
    fig.select('svg').attr('aria-label', spec.title);
    toc.append('a').attr('href', '#' + c.id).text(`${n}. ${spec.toc || spec.title.split(/:\s/)[0]}`);
  });
  d3.select('#foot').text(t('foot').replace('{built}', dateTxt(PF.built) + (PF.head ? ', ' + PF.head.slice(0, 10) : '')));
}
d3.selectAll('[data-lang]').on('click', function () { LANG = this.dataset.lang; try { localStorage.setItem('hr-viz-lang', LANG); } catch (e) {} render(); });
d3.selectAll('[data-theme-set]').on('click', function () {
  THEME = this.dataset.themeSet;
  if (THEME === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', THEME);
  try { localStorage.setItem('hr-viz-theme', THEME); } catch (e) {}
  render();
});
if (THEME !== 'auto') document.documentElement.setAttribute('data-theme', THEME);
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (THEME === 'auto') render(); }); } catch (e) {}
let lastW = innerWidth, rt;
addEventListener('resize', () => { if (Math.abs(innerWidth - lastW) < 40) return; clearTimeout(rt); rt = setTimeout(() => { lastW = innerWidth; const y = scrollY; render(); scrollTo(0, y); }, 200); });
render();
// labels are measured as they are drawn: draw again when the web fonts have loaded, so the measures are the fonts' own
let ft;
const redraw = () => { clearTimeout(ft); ft = setTimeout(() => { const y = scrollY; render(); scrollTo(0, y); }, 120); };
const T0 = Date.now();
if (document.fonts) { if (document.fonts.status !== 'loaded') document.fonts.ready.then(redraw); document.fonts.addEventListener('loadingdone', () => { if (Date.now() - T0 < 15000) redraw(); }); }
</script>
</body>
